<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Nizam · A · Inbox + detail</title>
<link rel="stylesheet" href="/static/proto/shared.css">
<style>
body { display: grid; grid-template-columns: 220px 380px 1fr; height: 100vh; }
.pane { min-width: 0; overflow-y: auto; }
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 8px; }
aside .row { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
aside .row:hover { background: var(--hover); } aside .row.on { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
aside .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
aside .brand { font-weight: 700; padding: 6px 8px 10px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.list { border-right: 1px solid var(--line); background: var(--bg); }
.list .head { position: sticky; top: 0; background: var(--bg); padding: 10px 12px 6px; border-bottom: 1px solid var(--line); z-index: 1; }
.list .head h2 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.list .head h2 span { flex: 1; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; }
.chip.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.item { display: grid; grid-template-columns: 16px 1fr auto; gap: 6px 8px; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
.item:hover { background: var(--hover); } .item.on { background: var(--accent-bg); }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .p { grid-column: 2 / 4; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .ago { color: var(--muted); font-size: 12px; }
.item .where { grid-column: 2 / 4; font-size: 11px; color: var(--muted); }
.detail { padding: 18px 22px; }
.detail h1 { font-size: 17px; margin: 0 0 4px; }
.detail .meta { color: var(--muted); font-size: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.detail .state { margin: 12px 0; display: flex; gap: 8px; align-items: center; font-weight: 600; }
.detail .msg { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; white-space: pre-wrap; line-height: 1.55; max-width: 780px; }
.detail .prompt { margin-top: 14px; color: var(--muted); font-size: 12px; border-left: 3px solid var(--line); padding-left: 10px; white-space: pre-wrap; max-width: 780px; }
.detail .actions { display: flex; gap: 8px; margin: 14px 0; }
.detail .empty { color: var(--muted); padding: 60px 0; text-align: center; }
.detail .why { background: var(--needs-bg); color: var(--text); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; max-width: 780px; }
</style></head><body>
<aside class="pane" id="side"></aside>
<section class="pane list" id="list"></section>
<section class="pane detail" id="detail"></section>
<div class="proto-note">Prototype A · Inbox + detail <a href="/static/proto/b.html">B</a><a href="/static/proto/c.html">C</a></div>
<script src="/static/proto/shared.js"></script>
<script>
let SEL = {agent: null, area: null}, CUR = null;
function render() {
  const all = DATA.sessions;
  let h = `<div class="brand">Nizam <span class="muted" style="font-weight:500">نظام</span></div>`;
  h += `<div class="row ${!SEL.agent?'on':''}" data-a=""><span class="name">All agents</span>${badges(counts(all))}</div>`;
  h += `<div class="sec">Agents</div>`;
  for (const a of DATA.agents) {
    const list = byAgent(a.root); if (!list.length) continue;
    h += `<div class="row ${SEL.agent===a.root?'on':''}" data-a="${esc(a.root)}">${a.pinned?'📌 ':''}<span class="name">${esc(a.display_name)}</span>${badges(counts(list))}</div>`;
  }
  $('#side').innerHTML = h;
  $('#side').querySelectorAll('[data-a]').forEach(el => el.onclick = () => { SEL = {agent: el.dataset.a || null, area: null}; render(); });

  const agent = DATA.agents.find(a => a.root === SEL.agent);
  let list = SEL.agent ? byAgent(SEL.agent) : all;
  if (SEL.area) list = list.filter(s => s.area && (s.area === SEL.area || s.area.startsWith(SEL.area + '/')));
  list = sortSessions(list);
  let l = `<div class="head"><h2><span>${agent ? esc(agent.display_name) : 'Everything'}</span><span class="muted" style="font-weight:500;font-size:12px">${list.length}</span><button class="primary" style="padding:2px 8px;font-size:12px">＋ New</button></h2>`;
  if (agent && agent.areas.length) {
    l += `<div class="chips"><span class="chip ${!SEL.area?'on':''}" data-ar="">all</span>` + agent.areas.map(ar => {
      const n = byAgent(agent.root).filter(s => s.area && s.area.startsWith(ar.rel)).length;
      return `<span class="chip ${SEL.area===ar.rel?'on':''}" data-ar="${esc(ar.rel)}">${'· '.repeat(ar.depth)}${esc(ar.name)}${n?` <b>${n}</b>`:''}</span>`; }).join('') + `</div>`;
  }
  l += `</div>`;
  let last = null;
  for (const s of list) {
    if (s.bucket !== last) { l += `<div class="sec ${s.bucket}">${SECTION[s.bucket]} <span class="muted" style="font-weight:500">${list.filter(x=>x.bucket===s.bucket).length}</span></div>`; last = s.bucket; }
    l += `<div class="item ${CUR===s.id?'on':''}" data-id="${s.id}"><span class="dot ${s.bucket}">${DOT[s.bucket]}</span><span class="t">${esc(s.title)}</span><span class="ago">${esc(s.ago)}</span>` +
         (SEL.agent ? (s.area ? `<span class="where">${esc(s.area)}</span>` : '') : `<span class="where">${esc(s.agent_name)}${s.area?' › '+esc(s.area):''}</span>`) +
         `<span class="p">${esc(s.bucket==='needs' && s.detail ? s.detail : lastPara(s.preview))}</span></div>`;
  }
  if (!list.length) l += `<div class="muted" style="padding:30px;text-align:center">Nothing here</div>`;
  $('#list').innerHTML = l;
  $('#list').querySelectorAll('[data-ar]').forEach(el => el.onclick = () => { SEL.area = el.dataset.ar || null; render(); });
  $('#list').querySelectorAll('[data-id]').forEach(el => el.onclick = () => { CUR = el.dataset.id; render(); });
  if (!CUR && list.length) CUR = list[0].id;
  renderDetail();
}
function renderDetail() {
  const s = DATA.sessions.find(x => x.id === CUR);
  if (!s) { $('#detail').innerHTML = `<div class="empty">Select a session</div>`; return; }
  $('#detail').innerHTML = `
    <h1>${esc(s.title)}</h1>
    <div class="meta"><b>${esc(s.agent_name)}</b>${s.area?` › ${esc(s.area)}`:''} · ${esc(s.ago)} ago ${s.live?'<span class="tag live">live</span>':'<span class="tag">exited</span>'}${s.question?'<span class="tag q">asks something</span>':''}</div>
    <div class="state"><span class="dot ${s.bucket}">${DOT[s.bucket]}</span>${esc(s.label)}</div>
    ${s.detail ? `<div class="why">${esc(s.detail)}</div>` : ''}
    <div class="actions"><button class="primary" data-act="open">${s.live?'Jump to':'Resume'}</button><button data-act="done">Done ✓</button><button>＋ New here</button></div>
    <div class="msg">${esc(s.preview || '(no reply yet)')}</div>
    ${s.last_prompt ? `<div class="prompt">You: ${esc(s.last_prompt)}</div>` : ''}`;
  $('#detail').querySelectorAll('[data-act]').forEach(el => el.onclick = async () => { await act(s.id, el.dataset.act); await loadBoard(); render(); });
}
loadBoard().then(render);
</script></body></html>
