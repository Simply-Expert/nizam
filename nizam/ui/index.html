<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nizam · نظام</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6ea; --text: #1a1d21; --muted: #6b7280;
  --needs: #d93025; --needs-bg: #fdecea; --working: #b26a00; --working-bg: #fff4dd;
  --inbox: #1a7f37; --inbox-bg: #e6f4ea; --done: #6b7280; --done-bg: #eef0f2;
  --accent: #2563eb; --accent-bg: #e8effd; --hover: #f0f2f5; --due: #7c3aed; --due-bg: #f1eafd; --star: #e0a800;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121417; --panel: #1b1e23; --line: #2a2f37; --text: #e6e8eb; --muted: #8b93a1;
  --needs: #ff6b62; --needs-bg: #3a1f1d; --working: #f0b04a; --working-bg: #3a2d14;
  --inbox: #4ccf7a; --inbox-bg: #16301f; --done: #8b93a1; --done-bg: #23272e;
  --accent: #6ea8ff; --accent-bg: #1c2a44; --hover: #22262d; --due: #b79bff; --due-bg: #2a2140; --star: #f5c542;
}}
:root[data-theme="dark"] {
  --bg: #121417; --panel: #1b1e23; --line: #2a2f37; --text: #e6e8eb; --muted: #8b93a1;
  --needs: #ff6b62; --needs-bg: #3a1f1d; --working: #f0b04a; --working-bg: #3a2d14;
  --inbox: #4ccf7a; --inbox-bg: #16301f; --done: #8b93a1; --done-bg: #23272e;
  --accent: #6ea8ff; --accent-bg: #1c2a44; --hover: #22262d; --due: #b79bff; --due-bg: #2a2140; --star: #f5c542;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); }
body { color: var(--text); font: 13px/1.45 var(--font); display: grid; grid-template-columns: 220px 380px 1fr; grid-template-rows: 100vh; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; cursor: pointer; }
button:hover { background: var(--accent-bg); border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.primary:hover { filter: brightness(1.08); }
button.quiet { border-color: transparent; color: var(--muted); }
button:disabled { opacity: .45; cursor: default; pointer-events: none; }
select, input, textarea { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; width: 100%; }
textarea { min-height: 84px; resize: vertical; }
.pane { min-width: 0; overflow-y: auto; }
.muted { color: var(--muted); }
.cnt { display: inline-flex; gap: 3px; }
.cnt b { min-width: 18px; text-align: center; font-size: 11px; padding: 0 5px; border-radius: 999px; font-weight: 600; }
.cnt .n { background: var(--needs-bg); color: var(--needs); }
.cnt .w { background: var(--working-bg); color: var(--working); }
.cnt .i { background: var(--inbox-bg); color: var(--inbox); }
.cnt .f { background: var(--due-bg); color: var(--due); }
.cnt .q { background: var(--accent-bg); color: var(--accent); }
.dot { font-size: 11px; width: 14px; display: inline-block; text-align: center; }
.dot.needs { color: var(--needs); } .dot.working { color: var(--working); } .dot.inbox { color: var(--inbox); } .dot.closed { color: var(--muted); } .dot.done { color: var(--done); } .dot.later { color: var(--due); }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--done-bg); color: var(--muted); }
.tag.live { background: var(--inbox-bg); color: var(--inbox); }
.tag.q { background: var(--needs-bg); color: var(--needs); }
.tag.bgw { background: var(--working-bg); color: var(--working); }
.tag.rem { background: var(--due-bg); color: var(--due); } .tag.rem.due { background: var(--needs-bg); color: var(--needs); }

/* ---- sidebar ---- */
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; }
aside .brand { font-weight: 700; padding: 6px 8px 10px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
aside .brand .ar { color: var(--muted); font-weight: 500; }
aside .brand .sp { flex: 1; }
aside .row { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
aside .row:hover { background: var(--hover); }
aside .row.on { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
aside .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
aside .row .pin { font-size: 11px; }
aside .row .awake { font-size: 11px; }
aside .row.agent[draggable] { cursor: grab; }
aside .row.drop-before { box-shadow: 0 -2px 0 var(--accent); }
aside .row.drop-after { box-shadow: 0 2px 0 var(--accent); }
aside .row.dragging { opacity: .4; }
aside .sec { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); padding: 10px 8px 4px; font-weight: 600; }
aside .foot { margin-top: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.chk { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
.chk input { width: auto; margin: 0; }

/* ---- list ---- */
.list { border-right: 1px solid var(--line); background: var(--bg); }
.list .head { position: sticky; top: 0; background: var(--bg); padding: 10px 12px 8px; border-bottom: 1px solid var(--line); z-index: 1; }
.list .head h2 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.list .head h2 .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .head h2 .n { font-weight: 500; color: var(--muted); font-size: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chips:empty { display: none; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.chip b { margin-left: 3px; color: var(--inbox); }
.chip.agentchip { display: none; }
.lsec { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); padding: 12px 12px 4px; font-weight: 600; }
.lsec.needs { color: var(--needs); } .lsec.working { color: var(--working); } .lsec.inbox { color: var(--inbox); } .lsec.closed { color: var(--muted); } .lsec.later { color: var(--due); } .lsec.done { color: var(--done); }
.lsec span { font-weight: 500; }
.lsec.fold { cursor: pointer; user-select: none; }
.lsec.fold::before { content: ""; display: inline-block; width: 5px; height: 5px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: translateY(-2px) rotate(45deg); margin: 0 8px 0 2px; transition: transform .15s; }
.lsec.fold.folded::before { transform: translateY(0) rotate(-45deg); }
.item { display: grid; grid-template-columns: 16px 1fr auto; gap: 3px 8px; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
.item:hover { background: var(--hover); }
.item.on { background: var(--accent-bg); }
.item.done { opacity: .7; }
.item.starred { box-shadow: inset 3px 0 0 var(--star); }
.item.starred .t::before, .detail h1 .star.on::before { content: "★ "; color: var(--star); }
.detail h1 .star { border: none; padding: 0 6px; font-size: 16px; color: var(--muted); }
.detail h1 .star::before { content: "☆"; }
.detail h1 .star:hover { background: none; color: var(--star); }
.item.closed .t { font-weight: 500; }
.item .rowdone { display: none; padding: 0 7px; font-size: 11px; line-height: 18px; }
.item.closed:hover .rowdone { display: inline-block; }
.item.closed:hover .agotxt { display: none; }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .ago { color: var(--muted); font-size: 12px; }
.item .bgw { color: var(--working); font-size: 11px; margin-right: 6px; white-space: nowrap; }
.item .rem { color: var(--due); font-size: 11px; margin-right: 6px; white-space: nowrap; } .item .rem.due { color: var(--needs); font-weight: 600; }
.item.later .agotxt { display: none; }
.item .where { grid-column: 2 / 4; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .p { grid-column: 2 / 4; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .p.why { color: var(--needs); }
.dot.fu { color: var(--muted); font-size: 9px; } .dot.fu.overdue { color: var(--needs); } .dot.fu.today { color: var(--working); }
.ago.due.overdue { color: var(--needs); font-weight: 600; } .ago.due.today { color: var(--working); font-weight: 600; }
.lsec.fu { color: var(--due); }
.lsec.rq { color: var(--accent); }
.dot.rq { color: var(--accent); font-size: 10px; } .dot.rq.aging { color: var(--working); } .dot.rq.old { color: var(--needs); }
.ago.rq.aging { color: var(--working); } .ago.rq.old { color: var(--needs); }
.detail textarea.rqbody { max-width: 820px; min-height: 160px; line-height: 1.55; padding: 14px 16px; border-radius: 10px; }
.dot.rt { color: var(--muted); } .dot.rt.completed { color: var(--inbox); } .dot.rt.running { color: var(--working); }
.dot.rt.incomplete, .dot.rt.errored, .dot.rt.timed_out, .dot.rt.needs_attention { color: var(--needs); }
.item.rt.off { opacity: .6; }
.tag.rt.completed { background: var(--inbox-bg); color: var(--inbox); } .tag.rt.running { background: var(--working-bg); color: var(--working); }
.tag.rt.incomplete, .tag.rt.errored, .tag.rt.timed_out, .tag.rt.needs_attention, .tag.warn { background: var(--needs-bg); color: var(--needs); }
.tag.due.overdue { background: var(--needs-bg); color: var(--needs); } .tag.due.today { background: var(--working-bg); color: var(--working); }
.empty { color: var(--muted); padding: 40px 12px; text-align: center; }
.onboard { padding: 40px 24px; max-width: 460px; margin: 0 auto; }
.onboard h2 { font-size: 15px; margin: 0 0 8px; }
.onboard p { color: var(--muted); margin: 0 0 12px; }
.onboard code { font-family: var(--mono); font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; color: var(--text); }

/* ---- check first: one wide column, no detail pane ---- */
body.triage .detail { display: none; }
@media (min-width: 761px) { body.triage .list { grid-column: 2 / 4; border-right: 0; } }
aside .row.tri .newo { color: var(--accent); font-size: 9px; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--accent-bg); } }
.tview { max-width: 920px; margin: 0 auto; padding: 22px 24px 48px; }
.tview .thead { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
.tview .thead h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; }
.tview .thead .n { color: var(--muted); font-size: 12px; }
.tview .thead .sp { flex: 1; }
.tview .reorder { padding: 3px 12px; font-size: 12px; border-radius: 999px; animation: pulse 1.6s ease-in-out infinite; }
.tview .keys { color: var(--muted); font-size: 12px; margin-top: 18px; }
.tview kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.item.tri { grid-template-columns: 30px 1fr auto; gap: 2px 12px; padding: 14px 16px; margin-bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.item.tri:hover { background: var(--panel); border-color: var(--muted); }
.item.tri.on { background: var(--panel); border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }
.item.tri .num { grid-row: 1 / 8; font: 600 18px var(--mono); color: var(--muted); padding-top: 1px; }
.item.tri.needs .num { color: var(--needs); }
.item.tri .who, .item.tri .t, .item.tri .nd, .item.tri .tw, .item.tri .tchips { grid-column: 2; }
.item.tri .who { font-size: 12px; color: var(--muted); }
.item.tri .who b { color: var(--text); font-weight: 600; }
.item.tri .t { font-size: 15px; white-space: normal; margin: 2px 0 3px; }
.item.tri .nd { font-size: 14px; line-height: 1.5; }
.item.tri .tw { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 5px; }
.item.tri .tchips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 9px; }
.item.tri .side { grid-column: 3; grid-row: 1 / 4; text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.item.tri .rowdone { display: none; }
.item.tri:hover .rowdone { display: inline-block; }
.item.tri.stale .t, .item.tri.stale .nd { opacity: .6; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.pill.needs { background: var(--needs-bg); color: var(--needs); } .pill.inbox { background: var(--inbox-bg); color: var(--inbox); }
.tchip { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tchip.high { color: var(--needs); border-color: var(--needs); } .tchip.quick { color: var(--inbox); border-color: var(--inbox); }
.tchip.deep { color: var(--working); border-color: var(--working); } .tchip.new { color: var(--accent); border-color: var(--accent); }
button.opt { font-size: 12px; padding: 3px 10px; border-radius: 8px; background: var(--bg); }
button.opt:hover { border-color: var(--accent); color: var(--accent); }
.tview .wline { margin-top: 22px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 0; }
.tview .wline b { color: var(--working); font-weight: 600; margin-right: 10px; }
.tview .wline a { color: var(--text); cursor: pointer; }
.tview .wline a:hover { color: var(--accent); text-decoration: underline; }
.tview .wline a + a::before { content: "·"; color: var(--muted); margin: 0 8px; display: inline-block; }
.detail .card { background: var(--accent-bg); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; max-width: 820px; }
.detail .card .opts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

/* ---- detail ---- */
.detail { padding: 18px 22px 30px; }
.detail h1 { font-size: 17px; margin: 0 0 4px; }
.detail h1 .t { cursor: text; }
.detail h1 .t:hover { color: var(--accent); }
.detail .meta { color: var(--muted); font-size: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.detail .state { margin: 12px 0; display: flex; gap: 8px; align-items: center; font-weight: 600; }
.detail .state.needs { color: var(--needs); } .detail .state.working { color: var(--working); } .detail .state.inbox { color: var(--inbox); } .detail .state.closed { color: var(--muted); } .detail .state.later { color: var(--due); } .detail .state.done { color: var(--done); }
.detail .why { background: var(--needs-bg); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; max-width: 820px; }
.detail .actions { display: flex; gap: 8px; margin: 12px 0 14px; flex-wrap: wrap; }
.detail .msg { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; white-space: pre-wrap; line-height: 1.55; max-width: 820px; overflow-wrap: anywhere; }
.detail .prompt { margin-bottom: 12px; color: var(--muted); font-size: 12px; border-left: 3px solid var(--line); padding-left: 10px; white-space: pre-wrap; max-width: 820px; overflow-wrap: anywhere; }
.detail .path { margin-top: 18px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.detail .back { display: none; margin-bottom: 10px; }

/* ---- settings ---- */
body.settings .list { display: none; }
@media (min-width: 761px) { body.settings .detail { grid-column: 2 / 4; } }
.set { max-width: 680px; margin-top: 22px; }
.set h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 2px; font-weight: 600; }
.set .r { display: flex; gap: 16px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.set .r:last-child { border-bottom: 0; }
.set .r .l { flex: 1; min-width: 0; }
.set .r .l b { display: block; font-weight: 600; }
.set .r .l span { color: var(--muted); font-size: 12px; }
.set .r .c { flex: none; display: flex; gap: 6px; align-items: center; }
.set .r .c select { width: auto; }
.set .r .c input[type=text], .set .r .c input[type=number] { width: 84px; }
.set .r .c input.wide { width: 230px; }
.set ol { margin: 4px 0 0; padding-left: 18px; color: var(--muted); font-size: 12px; }
.set a { color: var(--accent); }
.set code { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.set .r .l span b.warn { display: inline; font-weight: 600; color: var(--needs); }
aside .brand .setbtn { padding: 3px 5px; color: var(--muted); display: inline-flex; }
aside .brand .setbtn svg { width: 18px; height: 18px; }
aside .brand .setbtn:hover { color: var(--text); }
aside .brand .setbtn.on { color: var(--accent); background: var(--accent-bg); border-color: var(--accent); }
.detail .meta button.mini { padding: 0 8px; font-size: 12px; line-height: 20px; }
.detail .meta button.quiet.mini { color: var(--accent); padding: 0 2px; }
input.sw { appearance: none; -webkit-appearance: none; width: 34px; height: 20px; padding: 0; border: 0; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; }
input.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
input.sw:checked { background: var(--accent); }
input.sw:checked::after { left: 16px; }

/* ---- dialogs ---- */
.ctx { position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); padding: 4px; min-width: 160px; display: none; }
.ctx.open { display: block; }
.ctx div { padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.ctx div:hover { background: var(--accent-bg); }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 10; }
.modal-bg.open { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: 520px; max-width: calc(100vw - 32px); padding: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.modal h3 { margin: 0 0 12px; font-size: 14px; }
.modal .f { margin-bottom: 10px; }
.modal label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 4px; }
.modal .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; align-items: center; }
.modal .note { font-size: 11px; color: var(--muted); margin-top: 4px; }
.modal .note:empty { display: none; }
.modal .cmd { font-family: var(--mono); font-size: 11px; color: var(--muted); background: var(--bg); padding: 6px 8px; border-radius: 6px; word-break: break-all; }
.picks { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
#remErr { color: var(--needs); font-size: 12px; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--needs); color: #fff; padding: 8px 14px; border-radius: 8px; z-index: 30; display: none; }

/* ---- narrow: single list, detail slides over ---- */
@media (max-width: 760px) {
  body { grid-template-columns: 1fr; }
  aside { display: none; }
  .list { border-right: 0; }
  .chip.agentchip { display: inline-block; }
  .detail { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 5; overflow-y: auto; }
  .detail.open { display: block; }
  .detail .back { display: inline-block; }
}
</style>
</head>
<body>
<aside class="pane" id="side"></aside>
<section class="pane list" id="list"></section>
<section class="pane detail" id="detail"></section>

<div class="ctx" id="ctx"></div>
<div id="toast"></div>

<div class="modal-bg" id="ask">
  <div class="modal" style="width:420px">
    <h3 id="askTitle"></h3>
    <div class="f"><input id="askInput" type="text"></div>
    <div class="foot"><span id="askHint" style="flex:1;color:var(--muted);font-size:12px"></span><button id="askCancel">Cancel</button><button class="primary" id="askOk">Save</button></div>
  </div>
</div>

<div class="modal-bg" id="remind">
  <div class="modal" style="width:440px">
    <h3>Come back to this session at…</h3>
    <div class="picks"><button data-when="+30m">In 30 min</button><button data-when="+1h">In 1 hour</button><button data-when="+3h">In 3 hours</button><button data-when="tomorrow 9am">Tomorrow 9 AM</button></div>
    <div class="f"><input id="remInput" type="text" placeholder="1:30pm · 14:00 · +45m · tomorrow 9am · fri 10:00" spellcheck="false"><div class="note" id="remErr"></div></div>
    <div class="foot"><button id="remClear">Clear reminder</button><span style="flex:1"></span><button id="remCancel">Cancel</button><button class="primary" id="remOk">Set</button></div>
  </div>
</div>

<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ORDER = {needs: 0, working: 1, inbox: 2, later: 3, closed: 4, done: 5};
const SECTION = {needs: 'Needs you', working: 'Working', inbox: 'Your turn', closed: 'Closed', later: 'Later', done: 'Done'};
const FOLDABLE = ['closed', 'done'];
const DOT = {needs: '●', working: '◐', inbox: '●', closed: '○', later: '◷', done: '✓'};
function load(k, d) { try { const v = localStorage.getItem('nizam.'+k); return v ? JSON.parse(v) : d; } catch { return d; } }
function save(k, v) { try { localStorage.setItem('nizam.'+k, JSON.stringify(v)); } catch {} }

let DATA = null, SEL = load('sel', {agent: null, area: null}), CUR = new URLSearchParams(location.search).get('select'), DRAG = null;
let showDone = load('showDone', false), folded = load('folded', []), _lastKey = null, detailOpen = !!CUR;
if (CUR) SEL = {agent: null, area: null};
const NATIVE = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nizam;
let SETTINGS = new URLSearchParams(location.search).get('settings') === '1', SET = null, _setKey = null;
function nizamSelect(id) { SEL = {agent: null, area: null}; CUR = id; detailOpen = true; SETTINGS = false; refresh(true); }

async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {});
  return r.json();
}
function busyEditing() { return DRAG !== null || $('#ask').classList.contains('open') || $('#confirm').classList.contains('open') || $('#remind').classList.contains('open') || $('#ctx').classList.contains('open') || $('#modal').classList.contains('open'); }
async function refresh(force) {
  try {
    const d = await api('/api/board');
    if (SETTINGS) loadSettings(force);
    // Re-rendering swaps the DOM under the cursor; only do it when something other than the clock changed.
    const key = JSON.stringify(d, (k, v) => (k === 'ago' || k === 'generated_at') ? undefined : v);
    DATA = d;
    if (!force && key === _lastKey) { touchAgos(); return; }
    if (busyEditing() && !force) return;
    _lastKey = key; render();
  } catch (e) { console.error(e); }
}
function touchAgos() {
  for (const s of DATA.sessions) { const el = document.querySelector(`.item[data-id="${s.id}"] .agotxt`); if (el && el.textContent !== s.ago) el.textContent = s.ago; }
}

function counts(list) { const c = {needs:0, working:0, inbox:0, closed:0, later:0, done:0}; for (const s of list) c[s.bucket]++; return c; }
function badges(c, late, reqs) { return `<span class="cnt">${reqs?`<b class="q" title="Requests and replies from other agents">▸${reqs}</b>`:''}${late?`<b class="f" title="Follow-ups overdue or due today">◆${late}</b>`:''}${c.needs?`<b class="n">${c.needs}</b>`:''}${c.working?`<b class="w">${c.working}</b>`:''}${c.inbox?`<b class="i">${c.inbox}</b>`:''}</span>`; }
function lateCount(root) { return (DATA.followups || []).filter(f => (!root || f.agent === root) && f.due !== 'upcoming').length; }
function requestCount(root) { return (DATA.requests || []).filter(q => !root || q.agent === root).length; }
function rtNeeds(r) { return r.failing || !!r.attention; }
function failingCount(root) { return (DATA.routines || []).filter(r => (!root || r.agent === root) && rtNeeds(r)).length; }
function countsFor(list, root) { const c = counts(list); c.needs += failingCount(root); return c; }
function byAgent(root) { return DATA.sessions.filter(s => s.agent === root); }
function agentOf(root) { return DATA.agents.find(a => a.root === root); }
function lastPara(s) { const p = (s || '').split(/\n\s*\n/).map(x => x.trim()).filter(Boolean); return p[p.length - 1] || ''; }
function sortedAgents() {
  const order = DATA.agent_order || [];
  const rank = r => { const i = order.indexOf(r); return i < 0 ? 1e9 : i; };
  return [...DATA.agents].sort((a, b) => {
    if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    const ra = rank(a.root), rb = rank(b.root); if (ra !== rb) return ra - rb;
    const ca = counts(byAgent(a.root)), cb = counts(byAgent(b.root));
    return (cb.needs*100+cb.working*10+cb.inbox) - (ca.needs*100+ca.working*10+ca.inbox) || a.display_name.localeCompare(b.display_name);
  });
}
function triageOn() { return !!(DATA.triage && DATA.triage.enabled); }
function cardOf(id) { const i = triageOn() && DATA.triage.items.find(x => x.id === id); return i ? i.card : null; }
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
}
async function replyAndJump(id, text) { await copyText(text); toast('Copied. Paste it in the session', true); openSession(id); }
async function applyOrder() { await api('/api/triage/apply', {}); refresh(true); }
// The order holds still only while it is being looked at; arriving at it takes the newest.
let FRESH = true;
function cameBack() { FRESH = true; if (DATA) refresh(true); }
function boardShown() { cameBack(); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) cameBack(); });
window.addEventListener('focus', cameBack);
function visible(list) { return showDone ? list : list.filter(s => s.bucket !== 'done'); }
function currentList() {
  let list = SEL.agent ? byAgent(SEL.agent) : DATA.sessions;
  if (SEL.agent && SEL.area) list = list.filter(s => s.area && (s.area === SEL.area || s.area.startsWith(SEL.area + '/')));
  return visible(list).sort((a, b) => ORDER[a.bucket] - ORDER[b.bucket] || (a.bucket === 'later' ? a.remind_at - b.remind_at : b.last_activity - a.last_activity));
}

const ONBOARD = `<div class="onboard"><h2>No agents yet</h2><p>Every folder you run Claude Code in shows up here as an agent, with its sessions sorted by who needs you.</p><p>Open a terminal in any project and run <code>claude</code>. The board picks it up within a few seconds.</p></div>`;
function render() {
  if (!DATA) return;
  document.body.classList.toggle('settings', SETTINGS);
  if (SETTINGS) document.body.classList.remove('triage');
  if (SETTINGS) { renderSide(); renderSettings(); return; }
  if (!DATA.agents.length) { $('#side').innerHTML = `<div class="brand">Nizam <span class="ar">نظام</span></div>`; $('#list').innerHTML = ONBOARD; $('#detail').innerHTML = ''; $('#detail').classList.remove('open'); NAV = []; return; }
  if ((SEL.agent && !agentOf(SEL.agent)) || (SEL.triage && !triageOn())) SEL = {agent: null, area: null};
  document.body.classList.toggle('triage', !!SEL.triage);
  renderSide(); renderList(); renderDetail();
}

/* ---------- sidebar ---------- */
function renderSide() {
  const all = visible(DATA.sessions);
  let h = `<div class="brand">Nizam <span class="ar">نظام</span><span class="sp"></span><button class="quiet setbtn ${SETTINGS?'on':''}" id="setBtn" title="Settings (⌘,)" aria-label="Settings">${GEAR}</button>${NATIVE?`<button class="quiet setbtn ${DATA.prefs.board_pinned?'on':''}" id="pinBtn" aria-label="Keep board open" title="${DATA.prefs.board_pinned?'Unpin: back to a popover that closes on click-away':'Pin: keep the board open as a window'}">${PIN}</button>`:''}<button class="primary" id="newBtn" title="New session (n)">＋</button></div>`;
  if (triageOn()) h += `<div class="row tri ${SEL.triage&&!SETTINGS?'on':''}" data-tri="1" title="Waiting sessions in the order to check them"><span class="name">Check first</span>${DATA.triage.reorder?'<span class="newo" title="A new order is ready">●</span>':''}<span class="cnt">${DATA.triage.items.length?`<b class="i">${DATA.triage.items.length}</b>`:''}</span></div>`;
  h += `<div class="row ${!SEL.agent&&!SEL.triage&&!SETTINGS?'on':''}" data-a=""><span class="name">All agents</span>${badges(countsFor(all, null), lateCount(null), requestCount(null))}</div>`;
  h += `<div class="sec">Agents</div>`;
  const agents = sortedAgents();
  for (const a of agents) {
    const list = visible(byAgent(a.root));
    if (!list.length && !showDone && !a.pinned && !lateCount(a.root) && !failingCount(a.root) && !requestCount(a.root)) continue;
    h += `<div class="row agent ${SEL.agent===a.root&&!SETTINGS?'on':''}" draggable="true" data-root="${esc(a.root)}" data-a="${esc(a.root)}" title="${esc(a.display)}\nDrag to reorder · right-click to rename or pin">${a.pinned?'<span class="pin">📌</span>':''}<span class="name">${esc(a.display_name)}</span>${a.awake?'<span class="awake" title="Awake: open it in the Claude app on your phone">📱</span>':''}${badges(countsFor(list, a.root), lateCount(a.root), requestCount(a.root))}</div>`;
  }
  h += `<div class="foot"><label class="chk"><input type="checkbox" id="showDone" ${showDone?'checked':''}> Show done</label></div>`;
  const side = $('#side'); side.innerHTML = h;
  side.querySelectorAll('[data-a]').forEach(el => el.addEventListener('click', () => { SEL = {agent: el.dataset.a || null, area: null}; save('sel', SEL); CUR = null; SETTINGS = false; render(); }));
  const tri = side.querySelector('[data-tri]');
  if (tri) tri.addEventListener('click', () => { SEL = {agent: null, area: null, triage: true}; save('sel', SEL); CUR = null; SETTINGS = false; FRESH = true; render(); });
  $('#newBtn').addEventListener('click', () => openModal());
  $('#setBtn').addEventListener('click', () => SETTINGS ? closeSettings() : openSettings());
  if (NATIVE) $('#pinBtn').addEventListener('click', () => NATIVE.postMessage({pin: !DATA.prefs.board_pinned}));
  $('#showDone').addEventListener('change', e => { showDone = e.target.checked; save('showDone', showDone); render(); });
  wireAgentRows(side, agents);
}
function wireAgentRows(side, agents) {
  const rows = [...side.querySelectorAll('.row.agent')];
  rows.forEach(el => {
    el.addEventListener('contextmenu', e => { e.preventDefault(); openCtx(e.clientX, e.clientY, el.dataset.root); });
    el.addEventListener('dblclick', e => { e.preventDefault(); renameAgent(el.dataset.root); });
    el.addEventListener('dragstart', e => { DRAG = el.dataset.root; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    el.addEventListener('dragend', () => { DRAG = null; rows.forEach(r => r.classList.remove('dragging','drop-before','drop-after')); });
    el.addEventListener('dragover', e => {
      if (!DRAG || DRAG === el.dataset.root) return;
      e.preventDefault();
      const r = el.getBoundingClientRect(); const before = e.clientY < r.top + r.height / 2;
      rows.forEach(x => x.classList.remove('drop-before','drop-after'));
      el.classList.add(before ? 'drop-before' : 'drop-after');
    });
    el.addEventListener('drop', async e => {
      e.preventDefault();
      if (!DRAG || DRAG === el.dataset.root) return;
      const r = el.getBoundingClientRect(); const before = e.clientY < r.top + r.height / 2;
      const roots = agents.map(a => a.root).filter(x => x !== DRAG);
      const i = roots.indexOf(el.dataset.root);
      roots.splice(before ? i : i + 1, 0, DRAG);
      const moved = agentOf(DRAG), target = agentOf(el.dataset.root);
      if (moved && target && moved.pinned !== target.pinned) await api('/api/agents/set', {root: DRAG, pinned: target.pinned});
      await api('/api/agents/order', {roots});
      DRAG = null; refresh(true);
    });
  });
}
async function renameAgent(root) {
  const a = agentOf(root); if (!a) return;
  const name = await ask(`Display name for ${a.display}`, a.display_name, 'Empty restores the folder name');
  if (name === null) return;
  await api('/api/agents/set', {root, name});
  refresh(true);
}
function openCtx(x, y, root) {
  const a = agentOf(root); if (!a) return;
  const c = $('#ctx');
  c.innerHTML = `<div data-do="rename">Rename…</div><div data-do="pin">${a.pinned ? 'Unpin' : 'Pin to top'}</div><div data-do="top">Move to top</div><div data-do="new">New session here</div><div data-do="new-opts">New session with options…</div>${a.awake ? '<div data-do="sleep">Put to sleep</div>' : '<div data-do="wake">Wake for the phone</div>'}`;
  c.style.left = Math.min(x, window.innerWidth - 180) + 'px'; c.style.top = y + 'px';
  c.classList.add('open');
  c.querySelectorAll('[data-do]').forEach(el => el.addEventListener('click', async () => {
    c.classList.remove('open');
    if (el.dataset.do === 'rename') return renameAgent(root);
    if (el.dataset.do === 'new-opts') return openModal(root, '');
    if (el.dataset.do === 'new') return quickStart(root, '');
    if (el.dataset.do === 'wake') {
      toast(`Waking ${a.display_name}…`, true);
      const r = await api('/api/agents/wake', {root});
      toast(r.error ? `Couldn't wake ${a.display_name}: ${r.error}` : `${a.display_name} is awake. Open it in the Claude app on your phone.`, !r.error);
    }
    if (el.dataset.do === 'sleep') await api('/api/agents/sleep', {root});
    if (el.dataset.do === 'pin') await api('/api/agents/set', {root, pinned: !a.pinned});
    if (el.dataset.do === 'top') await api('/api/agents/order', {roots: [root, ...DATA.agents.map(z => z.root).filter(z => z !== root)]});
    refresh(true);
  }));
}
document.addEventListener('click', e => { if (!e.target.closest('#ctx')) $('#ctx').classList.remove('open'); });
document.addEventListener('click', e => {
  // The app's web view opens no new windows; the Mac's browser (or Telegram) opens the link instead.
  const a = e.target.closest('a[target="_blank"]');
  if (a && NATIVE) { e.preventDefault(); NATIVE.postMessage({open: a.href}); }
});

/* ---------- list ---------- */
let NAV = [];
function followupsFor(agentRoot, areaRel) {
  let f = DATA.followups || [];
  if (agentRoot) f = f.filter(x => x.agent === agentRoot);
  if (agentRoot && areaRel) f = f.filter(x => x.area && (x.area === areaRel || x.area.startsWith(areaRel + '/')));
  return f;
}
function followupRow(f, showAgent) {
  const a = agentOf(f.agent);
  const where = (showAgent && a ? esc(a.display_name) : '') + (f.area ? (showAgent ? ' › ' : '') + esc(f.area) : '');
  return `<div class="item fu ${f.due} ${CUR===f.id?'on':''}" data-id="${f.id}"><span class="dot fu ${f.due}">◆</span><span class="t">${esc(f.title)}</span><span class="ago due ${f.due}">${esc(f.when)}</span>${where?`<span class="where">${where}</span>`:''}<span class="p">${esc((f.body || '').split('\n')[0])}</span></div>`;
}
function requestRow(q, showAgent) {
  const a = agentOf(q.agent);
  const reply = q.kind === 'reply';
  const where = `${reply ? 'reply ' : ''}from ${esc(q.from)}` + (showAgent && a ? ` → ${esc(a.display_name)}` : '');
  return `<div class="item rq ${CUR===q.id?'on':''}" data-id="${q.id}"><span class="dot rq ${q.age}">${reply ? '◂' : '▸'}</span><span class="t">${esc(q.title)}</span><span class="ago rq ${q.age}">${q.status === 'started' ? 'started · ' : ''}${esc(q.ago)}</span><span class="where">${where}</span></div>`;
}
const RT_STATUS = {completed: 'Completed', no_change: 'Nothing new', needs_attention: 'Needs attention', incomplete: 'Incomplete', errored: 'Errored', timed_out: 'Timed out', running: 'Running', never: 'Never ran'};
const RT_DOT = {completed: '✓', no_change: '–', needs_attention: '!', incomplete: '!', errored: '!', timed_out: '!', running: '◐', never: '○'};
function routinesFor(agentRoot, areaRel) {
  let r = DATA.routines || [];
  if (agentRoot) r = r.filter(x => x.agent === agentRoot);
  if (agentRoot && areaRel) r = r.filter(x => x.area && (x.area === areaRel || x.area.startsWith(areaRel + '/')));
  return r;
}
function routineRow(r, showAgent) {
  const a = agentOf(r.agent);
  const where = (showAgent && a ? esc(a.display_name) : '') + (r.area ? (showAgent ? ' › ' : '') + esc(r.area) : '');
  const off = ['disabled', 'manual', 'invalid'].includes(r.state);
  const right = r.status === 'running' ? 'running' : r.next ? 'next ' + esc(r.next) : esc(r.state);
  const found = r.attention && !r.failing ? r.attention : null;
  const line = r.error ? r.error : found ? `Needs attention ${found.when} · ${(found.summary || '').split('\n')[0]}`
    : r.last ? `${RT_STATUS[r.status]} ${r.last.when} · ${(r.last.summary || '').split('\n')[0]}` : r.schedule;
  const shown = found ? 'needs_attention' : r.failing ? r.status : r.status === 'needs_attention' ? 'completed'
    : ['running', 'completed', 'no_change'].includes(r.status) ? r.status : 'never';
  return `<div class="item rt ${off?'off':''} ${CUR===r.id?'on':''}" data-id="${r.id}"><span class="dot rt ${shown}">${RT_DOT[shown]}</span><span class="t">${esc(r.name)}</span><span class="ago">${right}</span>${where?`<span class="where">${where}</span>`:''}<span class="p ${rtNeeds(r)||r.error?'why':''}">${esc(line)}</span></div>`;
}
function dotFor(s) { return s.bucket === 'working' && s.waiting && s.label !== 'Working' ? '◌' : DOT[s.bucket]; }
function sessionRow(s) {
  const where = SEL.agent ? (s.area ? esc(s.area) : '') : esc(s.agent_name) + (s.area ? ' › ' + esc(s.area) : '');
  const p = s.bucket === 'needs' && s.detail ? `<span class="p why">${esc(s.detail)}</span>` : `<span class="p">${esc(lastPara(s.preview))}</span>`;
  const bg = s.waiting ? `<span class="bgw" title="Still running in the background: ${esc(s.waiting)}">⧗ ${esc(s.waiting)}</span>` : '';
  const rem = s.remind_at ? `<span class="rem ${s.remind_due?'due':''}" title="Reminder you set">⏰ ${esc(s.remind_label)}</span>` : '';
  return `<div class="item ${s.bucket} ${s.starred?'starred':''} ${CUR===s.id?'on':''}" data-id="${s.id}" title="Double-click or Enter to ${s.live?'jump to':'resume'}"><span class="dot ${s.bucket}">${dotFor(s)}</span><span class="t">${esc(s.title)}</span><span class="ago">${bg}${rem}<span class="agotxt">${esc(s.ago)}</span>${s.bucket==='closed'?`<button class="rowdone" data-done="${s.id}" title="Mark done">Done ✓</button>`:''}</span>${where?`<span class="where">${where}</span>`:''}${p}</div>`;
}
const KIND = {decide: 'decide', approve: 'approve', answer: 'answer', review: 'review', unblock: 'unblock', fyi: 'FYI'};
function triageRow(i, n, s) {
  const c = i.card;
  const chips = c ? [`<span class="tchip">${esc(KIND[c.kind] || c.kind)}</span>`, `<span class="tchip ${esc(c.effort)}">${esc(c.effort)}</span>`,
                     c.stakes === 'high' ? '<span class="tchip high">high stakes</span>' : ''].join('') : '';
  const state = i.building ? '<span class="tchip">reading…</span>' : i.stale ? '<span class="tchip" title="The session moved on since this was written">out of date</span>' : '';
  const replies = (c && c.options || []).map(o => `<button class="opt" data-reply="${esc(o)}" title="Copy, then jump to the session">${esc(o)}</button>`).join('');
  return `<div class="item tri ${s.bucket} ${i.stale?'stale':''} ${CUR===s.id?'on':''}" data-id="${s.id}" title="Click or Enter to jump to it">
    <span class="num">${n + 1}</span>
    <span class="who"><b>${esc(s.agent_name)}</b>${s.area ? ' › ' + esc(s.area) : ''}${i.new ? ' <span class="tchip new">new</span>' : ''}</span>
    <span class="t">${esc(c ? c.headline : s.title)}</span>
    <span class="nd">${esc(c ? c.needs : i.building ? 'Reading the session…' : lastPara(s.preview))}</span>
    ${i.why ? `<span class="tw">${esc(i.why)}</span>` : ''}
    ${chips || state || replies ? `<span class="tchips">${chips}${state}${replies}</span>` : ''}
    <span class="side"><span class="pill ${s.bucket}">${esc(s.label)}</span><span class="agotxt">${esc(s.ago)}</span><button class="rowdone" data-done="${s.id}" title="Mark done (d)">Done ✓</button></span></div>`;
}
function workingLink(s) {
  const c = cardOf(s.id);
  return `<a data-jump="${s.id}" title="${esc(c ? c.headline : s.title)} · ${esc(s.ago)}">${esc(s.agent_name)}${s.area ? ' › ' + esc(s.area) : ''}</a>`;
}
function renderTriage() {
  const T = DATA.triage, byId = Object.fromEntries(DATA.sessions.map(s => [s.id, s]));
  if (FRESH && T.reorder) { FRESH = false; applyOrder(); return; }
  FRESH = false;
  const items = T.items.filter(i => byId[i.id]);
  const working = DATA.sessions.filter(s => s.bucket === 'working');
  NAV = items.map(i => i.id);
  if (!NAV.includes(CUR)) CUR = NAV[0] || null;
  let h = `<div class="tview"><div class="thead"><h2>Check in this order</h2><span class="n">${items.length}</span><span class="sp"></span>${T.reorder ? '<button class="primary reorder" data-reorder="1" title="Put the list in the newest order (r)">New order ready · r</button>' : ''}</div>`;

const GEAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>';
const LAUNCHER_LABEL = {Terminal: 'Terminal.app', Claude: 'Claude app'};
const MODE_LABEL = {acceptEdits: 'Accept edits', default: 'Ask first', plan: 'Plan', auto: 'Auto'};
function setRow(label, about, control) {
  return `<div class="r"><div class="l"><b>${label}</b>${about ? `<span>${about}</span>` : ''}</div><div class="c">${control}</div></div>`;
}
function sw(attr, on, disabled) { return `<input type="checkbox" class="sw" ${attr} ${on ? 'checked' : ''} ${disabled ? 'disabled' : ''}>`; }
function opts(pairs, cur) { return pairs.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(cur) ? 'selected' : ''}>${esc(l)}</option>`).join(''); }
function renderSettings() {
  const d = $('#detail');
  d.classList.toggle('open', detailOpen);
  if (!SET) { d.innerHTML = `<div class="muted">Loading settings…</div>`; return; }
  const A = SET.app, T = SET.telegram;
  const bot = T.bot ? `@${esc(T.bot)}` : '';
  const appOnly = '<span class="muted" style="font-size:12px">In the menu bar app</span>';
  const ver = A.latest ? `${esc(A.latest)} is available · ${NATIVE ? `<button class="primary mini" data-act="update">Update</button>` : '<code>nizam update</code>'}`
    : `${A.current ? 'up to date' : 'not checked yet'} · <button class="quiet mini" data-act="check">Check now</button>`;
  let h = `<button class="back quiet" id="back">‹ Back</button><h1>Settings</h1>
    <div class="meta">Nizam ${esc(A.current || A.version)}, ${ver}${A.running ? '' : ' · the menu bar app is not running: <code>nizam app --detach</code>'}</div>`;

  h += `<div class="set"><h2>This Mac</h2>`
    + setRow('Notifications', 'A banner when something newly needs you. Click it to go there.',
             NATIVE ? sw('data-native="notifications"', A.notifications) : appOnly)
    + setRow('Start at login', 'Open Nizam when you log in to this Mac.', sw('data-set="login"', A.login))
    + setRow('Floating badge', 'Live counts above other windows; hover for the lists. Handy when the menu bar is full.',
             NATIVE ? sw('data-native="badge"', A.badge) : appOnly)
    + setRow('Keep board open', 'A regular window instead of a popover that closes when you click away.',
             NATIVE ? sw('data-native="pin"', A.board_pinned) : appOnly)
    + `</div>`;

  h += `<div class="set"><h2>Phone</h2>`;
  const botLink = T.bot ? `<a href="https://t.me/${encodeURIComponent(T.bot)}" target="_blank">${bot}</a>` : '';
  const quiet = A.running ? '' : '<br><b class="warn">The menu bar app is not running, so the bot cannot answer.</b> Start it with <code>nizam app --detach</code>.';
  if (!T.bot) {
    h += setRow('Telegram', `Wake an agent from your phone, then talk to it in the Claude app. The bot also messages you when something needs you. Setting it up takes about two minutes:
      <ol><li>Install the Claude app on your phone and sign in with the account Claude Code uses on this Mac. That is where you talk to an awake agent.</li>
      <li>In Telegram, open <a href="https://t.me/BotFather" target="_blank">@BotFather</a> and send <code>/newbot</code>. Give the bot any name, then a username that ends in <code>bot</code>, like <code>yourname_nizam_bot</code>.</li>
      <li>BotFather replies with a token like <code>123456789:AAH…</code>. Paste it here and connect. Keep it private: whoever has it controls the bot.</li>
      <li>Next, you pair your Telegram account, so the bot answers only you.</li></ol>`,
      `<input type="text" class="wide" id="tgToken" placeholder="123456789:AAH…" spellcheck="false" autocomplete="off"><button class="primary" data-act="connect">Connect</button>`);
  } else {
    h += setRow('Telegram', `${botLink} · ${T.paired ? `answers ${T.paired === 1 ? 'only your account' : `${T.paired} paired accounts`}. Send it <code>/help</code> to see what it does, or <code>/wake</code> to try it.` : 'not paired yet'}${quiet}`,
                `<button data-act="disconnect">Disconnect</button>`);
    if (!T.paired)
      h += setRow('Pair your account', `Open ${botLink} in Telegram and send it any message, like <code>hi</code>. It replies with a 6-character code; enter it here within 10 minutes.`,
                  `<input type="text" id="tgCode" placeholder="A1B2C3" spellcheck="false" autocomplete="off"><button class="primary" data-act="pair">Pair</button>`);
    h += setRow('Message me', 'When something newly needs you: a blocked session, a routine that failed or found something, a follow-up due at its time. Once for each thing.',
                `<select data-set="notify">${opts([['off', 'Never'], ['away', 'When I’m away'], ['always', 'Always']], T.notify)}</select>`);
    if (T.notify === 'away')
      h += setRow('Away means', 'No keyboard or mouse input on this Mac for this long. Whatever is still waiting then is sent.',
                  `<input type="number" min="1" max="240" data-set="away_minutes" value="${esc(T.away_minutes)}"> min`);
  }
  h += setRow('Phone sessions start in', 'The permission mode of sessions you open in the Claude app on an awake agent.',
              `<select data-set="permission_mode">${opts(T.modes.map(m => [m, MODE_LABEL[m] || m]), T.permission_mode)}</select>`)
    + setRow('Back to sleep after', 'An awake agent with no session activity for this long goes back to sleep.',
             `<select data-set="idle_hours">${opts([...new Set([...IDLE_HOURS, T.idle_hours])].map(n => [n, n ? `${n} hour${n > 1 ? 's' : ''}` : 'Never']), T.idle_hours)}</select>`)
    + `</div>`;

  h += `<div class="set"><h2>Sessions and follow-ups</h2>`
    + setRow('New sessions open in', A.launcher === 'Claude'
               ? 'Where ＋ New, Start session and follow-ups open. The Claude app opens on the folder with the task typed in; pick the permission mode there and send it.'
               : 'Where ＋ New, Start session and follow-ups open.',
             `<select data-set="launcher">${opts(A.launchers.map(l => [l, LAUNCHER_LABEL[l] || l]), A.launcher)}</select>`)
    + (A.launcher === 'Claude' ? setRow('Everything else opens in', 'Resuming a closed session, new git worktrees, and requests from other agents, which start in plan mode.',
             `<select data-set="terminal">${opts(A.launchers.filter(l => l !== 'Claude').map(l => [l, LAUNCHER_LABEL[l] || l]), A.terminal)}</select>`) : '')
    + setRow('Check first', 'Claude reads what each waiting session last said and suggests which to answer first. It uses your Claude plan: a quick Haiku call when sessions stop, and a Sonnet call to order them.',
             sw('data-set="triage"', A.triage))
    + setRow('Untimed follow-ups come up at', 'A follow-up with a time of its own comes up then instead.',
             `<input type="text" data-set="followup_hour" value="${esc(SET.followups.hour)}" spellcheck="false">`)
    + `</div>`;
  d.innerHTML = h;

  $('#back').addEventListener('click', closeSettings);
  d.querySelectorAll('[data-set]').forEach(el => el.addEventListener('change', () =>
    saveSetting(el.dataset.set, el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value)));
  d.querySelectorAll('[data-native]').forEach(el => el.addEventListener('change', () => {
    NATIVE.postMessage({[el.dataset.native]: el.checked});
    setTimeout(() => loadSettings(true), 400);
  }));
  d.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', () => settingsAction(el)));
  const enter = (sel, act) => { const i = $(sel, d); if (i) i.addEventListener('keydown', e => { if (e.key === 'Enter') settingsAction($(`[data-act="${act}"]`, d)); }); };
  enter('#tgToken', 'connect'); enter('#tgCode', 'pair');
}
async function saveSetting(key, value) {
  const r = await api('/api/settings', {[key]: value});
  if (r.error) toast(r.error);
  if (r.settings) { SET = r.settings; _setKey = JSON.stringify(SET); }
  if (document.activeElement) document.activeElement.blur();
  r.error ? loadSettings(true) : renderSettings();
}
async function settingsAction(el) {
  const act = el.dataset.act, post = (path, body) => api(`/api/settings/${path}`, body || {});
  let r;
  if (act === 'connect') {
    const token = $('#tgToken').value.trim();
    if (!token) { toast('Paste the token @BotFather gave you'); return; }
    el.disabled = true; el.textContent = 'Connecting…';
    r = await post('telegram-connect', {token});
    if (!r.error) toast(`Connected @${r.settings.telegram.bot}. Now send it any message on Telegram.`, true);
  } else if (act === 'pair') {
    r = await post('telegram-pair', {code: $('#tgCode').value.trim()});
    if (!r.error) toast('Paired. The bot answers only you.', true);
  } else if (act === 'disconnect') {
    if (!await confirmBox('Disconnect the Telegram bot?', 'It stops answering and stops messaging you. Agents already awake stay awake.', 'Disconnect')) return;
    r = await post('telegram-disconnect');
  } else if (act === 'check') {
    el.disabled = true; el.textContent = 'Checking…';
    r = await post('check-update');
    if (!r.error) toast(r.settings.app.latest ? `${r.settings.app.latest} is available` : 'Nizam is up to date', true);
  } else if (act === 'update') {
    NATIVE.postMessage({update: true}); toast('Updating… Nizam restarts when it is done.', true); return;
  }
  if (r && r.error) toast(r.error);
  if (r && r.settings) { SET = r.settings; _setKey = JSON.stringify(SET); }
  renderSettings();
}

/* ---------- dialogs ---------- */
function ask(title, value, hint) {
  return new Promise(resolve => {
    const m = $('#ask'), inp = $('#askInput');
    $('#askTitle').textContent = title; $('#askHint').textContent = hint || ''; inp.value = value || '';
    m.classList.add('open'); inp.focus(); inp.select();
    const done = v => { m.classList.remove('open'); cleanup(); resolve(v); };
    const onKey = e => { if (e.key === 'Enter') done(inp.value); if (e.key === 'Escape') done(null); e.stopPropagation(); };
    const onOk = () => done(inp.value), onCancel = () => done(null);
    const onBg = e => { if (e.target.id === 'ask') done(null); };
    function cleanup() { inp.removeEventListener('keydown', onKey); $('#askOk').removeEventListener('click', onOk); $('#askCancel').removeEventListener('click', onCancel); m.removeEventListener('click', onBg); }
    inp.addEventListener('keydown', onKey); $('#askOk').addEventListener('click', onOk); $('#askCancel').addEventListener('click', onCancel); m.addEventListener('click', onBg);
  });
}
function confirmBox(title, hint, yesLabel) {
  return new Promise(resolve => {
    const m = $('#confirm'), yes = $('#confirmYes');
    $('#confirmTitle').textContent = title; $('#confirmHint').textContent = hint || ''; yes.textContent = yesLabel || 'Yes';
    m.classList.add('open'); yes.focus();
    const done = v => { m.classList.remove('open'); cleanup(); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') done(false); e.stopPropagation(); };
    const onYes = () => done(true), onNo = () => done(false);
    const onBg = e => { if (e.target.id === 'confirm') done(false); };
    function cleanup() { m.removeEventListener('keydown', onKey); yes.removeEventListener('click', onYes); $('#confirmNo').removeEventListener('click', onNo); m.removeEventListener('click', onBg); }
    m.addEventListener('keydown', onKey); yes.addEventListener('click', onYes); $('#confirmNo').addEventListener('click', onNo); m.addEventListener('click', onBg);
  });
}
function remindBox(s) {
  const m = $('#remind'), inp = $('#remInput'), err = $('#remErr');
  inp.value = ''; err.textContent = s.remind_at ? `Set for ${s.remind_label}` : '';
  err.style.color = s.remind_at ? 'var(--muted)' : '';
  $('#remClear').style.display = s.remind_at ? '' : 'none';
  m.classList.add('open'); inp.focus();
  const close = () => { m.classList.remove('open'); cleanup(); };
  const submit = async when => {
    const r = await api(`/api/sessions/${s.id}/remind`, {when});
    if (r.error) { err.style.color = ''; err.textContent = r.error; inp.focus(); return; }
    close(); toast(r.at ? `Back ${r.spoken}` : 'Reminder cleared', true);
    await refresh(true);
    const row = document.querySelector(`.item[data-id="${s.id}"]`); if (row) row.scrollIntoView({block: 'nearest'});
  };
  const onKey = e => { if (e.key === 'Enter' && inp.value.trim()) submit(inp.value); if (e.key === 'Escape') close(); e.stopPropagation(); };
  const onOk = () => inp.value.trim() ? submit(inp.value) : inp.focus();
  const onClear = () => submit('off'), onCancel = () => close();
  const onPick = e => { const b = e.target.closest('[data-when]'); if (b) submit(b.dataset.when); };
  const onBg = e => { if (e.target.id === 'remind') close(); };
  function cleanup() { inp.removeEventListener('keydown', onKey); $('#remOk').removeEventListener('click', onOk); $('#remClear').removeEventListener('click', onClear); $('#remCancel').removeEventListener('click', onCancel); m.removeEventListener('click', onPick); m.removeEventListener('click', onBg); }
  inp.addEventListener('keydown', onKey); $('#remOk').addEventListener('click', onOk); $('#remClear').addEventListener('click', onClear); $('#remCancel').addEventListener('click', onCancel); m.addEventListener('click', onPick); m.addEventListener('click', onBg);
}
function toast(msg, ok) { const t = $('#toast'); t.textContent = msg; t.style.background = ok ? 'var(--inbox)' : 'var(--needs)'; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500); }

/* ---------- new session ---------- */
async function quickStart(agentRoot, areaRel) {
  const a = agentOf(agentRoot); if (!a) return openModal(agentRoot, areaRel);
  const last = DATA.prefs.last_start || {};
  const cwd = areaRel ? a.root + '/' + areaRel : a.root;
  const r = await api('/api/start', {cwd, prompt: '', permission_mode: last.permission_mode || 'acceptEdits', worktree: false, paste: false});
  if (r.error) { toast(r.error); return; }
  toast(`Started in ${a.display_name}${areaRel ? ' › ' + areaRel : ''}`, true);
  setTimeout(() => refresh(true), 1500);
}
function newHere(e, agentRoot, areaRel) {
  if (e && (e.altKey || e.metaKey || e.button === 2)) return openModal(agentRoot, areaRel);
  return quickStart(agentRoot, areaRel);
}
function openModal(agentRoot, areaRel) {
  if (!DATA || !DATA.agents.length) { toast('No agents yet. Run claude in a project folder first.'); return; }
  const sel = $('#mAgent');
  sel.innerHTML = sortedAgents().map(a => `<option value="${esc(a.root)}">${esc(a.display_name)}  (${esc(a.display)})</option>`).join('');
  const last = DATA.prefs.last_start || {};
  sel.value = agentRoot || SEL.agent || last.cwd || '';
  if (!sel.value && DATA.agents[0]) sel.value = sortedAgents()[0].root;
  fillAreas(areaRel !== undefined && areaRel !== null ? areaRel : (SEL.agent === sel.value ? SEL.area : ''));
  syncWhere();
  $('#mPerm').value = last.permission_mode || 'acceptEdits';
  $('#mLauncher').value = DATA.prefs.launcher || 'Terminal';
  $('#mPrompt').value = '';
  updateCmd();
  $('#modal').classList.add('open');
  $('#mPrompt').focus();
}
function fillAreas(want) {
  const a = agentOf($('#mAgent').value);
  $('#mArea').innerHTML = [`<option value="">— agent root —</option>`].concat((a ? a.areas : []).map(ar => `<option value="${esc(ar.rel)}">${'  '.repeat(ar.depth)}${esc(ar.rel)}</option>`)).join('');
  $('#mArea').value = want || '';
}
function syncWhere() {
  const a = agentOf($('#mAgent').value), git = !!(a && a.git);
  $('#mWhere').querySelector('[value="worktree"]').disabled = !git;
  if (!git) $('#mWhere').value = 'same';
  $('#mWhereNote').textContent = git ? '' : 'Worktrees need a git repository; this folder is not in one.';
}
function startPayload() {
  const a = agentOf($('#mAgent').value);
  const area = $('#mArea').value;
  return {cwd: area ? a.root + '/' + area : a.root, prompt: $('#mPrompt').value, permission_mode: $('#mPerm').value,
          worktree: $('#mWhere').value === 'worktree', paste: $('#mPaste').checked};
}
function updateCmd() {
  if (!DATA) return;
  const p = startPayload();
  let c = `cd ${p.cwd.replace(/^\/Users\/[^/]+/, '~')} && claude --session-id <new>` + (p.permission_mode !== 'default' ? ` --permission-mode ${p.permission_mode}` : '') + (p.prompt.trim() ? ` '${p.prompt.trim().slice(0,60)}${p.prompt.trim().length>60?'…':''}'` : '');
  if (p.worktree) c = '(git worktree add …) && ' + c;
  const app = $('#mLauncher').value === 'Claude' && !p.worktree;
  if (app) c = `The Claude app opens a new session in ${p.cwd.replace(/^\/Users\/[^/]+/, '~')}` + (p.prompt.trim() ? ', with the task typed in for you to send.' : '.');
  $('#mPerm').disabled = $('#mPaste').disabled = app;
  $('#mCmd').textContent = c;
}
$('#mAgent').addEventListener('change', () => { fillAreas(''); syncWhere(); updateCmd(); });
['#mArea','#mPrompt','#mPerm','#mWhere'].forEach(s => $(s).addEventListener('input', updateCmd));
$('#mLauncher').addEventListener('change', async () => { updateCmd(); await api('/api/prefs', {launcher: $('#mLauncher').value}); });
$('#mCancel').addEventListener('click', () => $('#modal').classList.remove('open'));
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').classList.remove('open'); });
$('#mGo').addEventListener('click', async () => {
  const p = startPayload();
  const first = p.prompt.trim().split('\n')[0];
  if (first) p.title = first.slice(0, 90);
  const r = await api('/api/start', p);
  if (r.error) { toast(r.error); return; }
  $('#modal').classList.remove('open');
  setTimeout(() => refresh(true), 1500);
});

/* ---------- keys ---------- */
document.addEventListener('keydown', e => {
  if (e.key === ',' && e.metaKey) { e.preventDefault(); SETTINGS ? closeSettings() : openSettings(); return; }
  if (/input|textarea|select/i.test(e.target.tagName)) return;
  if (SETTINGS) { if (e.key === 'Escape' && !busyEditing()) closeSettings(); return; }
  if (e.key === 'Escape') { $('#modal').classList.remove('open'); $('#ctx').classList.remove('open'); if (detailOpen) { detailOpen = false; render(); } }
  if (e.key === 'n' && !e.metaKey && !e.ctrlKey) openModal();
  if (e.key === 'j' || e.key === 'k' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!NAV.length) return;
    let i = NAV.indexOf(CUR); i = Math.max(0, Math.min(NAV.length - 1, i + ((e.key === 'j' || e.key === 'ArrowDown') ? 1 : -1)));
    CUR = NAV[i]; renderListSelection(); renderDetail(); e.preventDefault();
    const el = document.querySelector(`.item[data-id="${CUR}"]`); if (el) el.scrollIntoView({block: 'nearest'});
  }
  if (e.key === 's' && CUR && !e.metaKey && !e.ctrlKey && DATA.sessions.some(x => x.id === CUR)) api(`/api/sessions/${CUR}/star`, {}).then(() => refresh(true));
  if (e.key === 'z' && CUR && !e.metaKey && !e.ctrlKey) { const s = DATA.sessions.find(x => x.id === CUR); if (s) { e.preventDefault(); remindBox(s); } }
  if (e.key === 'd' && CUR) { const s = DATA.sessions.find(x => x.id === CUR); if (s && s.bucket !== 'done') api(`/api/sessions/${CUR}/done`, {}).then(() => refresh(true)); }
  if (e.key === 'Enter') openSession(CUR);
  if (SEL.triage && !e.metaKey && !e.ctrlKey) {
    if (e.key === 'r' && DATA.triage && DATA.triage.reorder) applyOrder();
    if (/^[1-9]$/.test(e.key) && NAV[+e.key - 1]) { CUR = NAV[+e.key - 1]; openSession(CUR); render(); }
  }
});

refresh(true);
setInterval(refresh, 3000);
</script>
